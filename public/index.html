<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventario Banda Zoila Hora de Robles</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>🎺 Banda Zoila Hora de Robles</h1>
        <p>Sistema de Gestión de Inventario 2025</p>
    </header>

    <!-- Dashboard Rápido -->
    <section class="stats-container">
        <div class="stat-card">
            <h3 id="total-count">0</h3>
            <p>Total Instrumentos</p>
        </div>
        <div class="stat-card">
            <h3 id="new-count">0</h3>
            <p>Adquiridos 2025</p>
        </div>
        <div class="stat-card">
            <h3 id="repair-count" style="color: var(--danger)">0</h3>
            <p>En Reparación/Malos</p>
        </div>
    </section>

    <!-- Controles -->
    <section class="controls">
        <input type="text" id="search" class="search-bar" placeholder="Buscar instrumento (Ej: Saxofón)...">
        <a href="registro.html" class="btn btn-primary">+ Nuevo</a>
    </section>

    <section class="controls">
        <button class="btn btn-filter active" onclick="filterData('all')">Todos</button>
        <button class="btn btn-filter" onclick="filterData('2025')">Nuevos (2025)</button>
        <button class="btn btn-filter" onclick="filterData('reparacion')">Reparación/Baja</button>
    </section>

    <!-- Lista de Resultados -->
    <main class="inventory-list" id="inventory-container">
        <!-- Aquí JS inyectará los instrumentos -->
        <p style="text-align:center">Cargando inventario...</p>
    </main>

    <script type="module" src="js/app.js"></script>
</body>
</html>
