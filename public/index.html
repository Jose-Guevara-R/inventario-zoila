<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventario Banda Zoila Hora de Robles</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>🎺 Banda Zoila Hora de Robles</h1>
        <p>Sistema de Gestión de Inventario 2025</p>
    </header>

    <!-- Dashboard Rápido -->
    <section class="stats-container">
        <div class="stat-card">
            <h3 id="total-count">0</h3>
            <p>Total Instrumentos</p>
        </div>
        <div class="stat-card">
            <h3 id="new-count">0</h3>
            <p>Adquiridos 2025</p>
        </div>
        <div class="stat-card">
            <h3 id="repair-count" style="color: var(--danger)">0</h3>
            <p>En Reparación/Malos</p>
        </div>
    </section>

    <!-- Controles -->
    <section class="controls">
        <input type="text" id="search" class="search-bar" placeholder="Buscar instrumento (Ej: Saxofón)...">
        <a href="registro.html" class="btn btn-primary">+ Nuevo</a>
    </section>

    <section class="controls">
        <button class="btn btn-filter active" onclick="filterData('all')">Todos</button>
        <button class="btn btn-filter" onclick="filterData('2025')">Nuevos (2025)</button>
        <button class="btn btn-filter" onclick="filterData('reparacion')">Reparación/Baja</button>
    </section>

    <!-- Lista de Resultados -->
    <main class="inventory-list" id="inventory-container">
        <!-- Aquí JS inyectará los instrumentos -->
        <p style="text-align:center">Cargando inventario...</p>
    </main>

    <!-- ... Resto de tu HTML ... -->

    <!-- Modal de Edición -->
    <div id="editModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <h2 style="margin-bottom: 1rem;">Editar Instrumento</h2>
            
            <form id="edit-form">
                <!-- ID oculto (necesario para saber cuál actualizar) -->
                <input type="hidden" id="edit-id" name="id">

                <div class="form-group">
                    <label>Nombre</label>
                    <input type="text" id="edit-nombre" name="nombre" required>
                </div>
                
                <div class="form-group">
                    <label>Estado Actual</label>
                    <select id="edit-estado" name="estado" required>
                        <option value="NUEVO">Nuevo</option>
                        <option value="BUENO">Bueno</option>
                        <option value="REGULAR">Regular</option>
                        <option value="MALO">Malo (Requiere Reparación)</option>
                        <option value="BAJA">De Baja (Inservible)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Ubicación</label>
                    <select id="edit-ubicacion" name="ubicacion">
                        <option value="ALMACEN">Almacén</option>
                        <option value="PRESTADO">Prestado</option>
                        <option value="REPARACION">En Taller</option>
                    </select>
                </div>

                <!-- Campos extra ocultos visualmente pero necesarios para no borrarlos -->
                <input type="hidden" id="edit-marca" name="marca">
                <input type="hidden" id="edit-modelo" name="modelo">
                <input type="hidden" id="edit-serie" name="serie">
                <input type="hidden" id="edit-fecha" name="fecha_adquisicion">
                <input type="hidden" id="edit-origen" name="origen">

                <button type="submit" class="btn btn-primary" style="width: 100%">Guardar Cambios</button>
            </form>
        </div>
    </div>

    <!-- Script principal -->
    <script type="module" src="js/app.js"></script>
</body>
</html>
