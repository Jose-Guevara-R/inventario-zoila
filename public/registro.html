<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Instrumento - Zoila Hora</title>
    <link rel="stylesheet" href="styles.css">
    
    <!-- SCRIPT DE SEGURIDAD -->
    <script>
        if (!sessionStorage.getItem('usuario_autorizado')) {
            window.location.href = 'login.html';
        }
    </script>
</head>
<body>
    <header>
        <h1>Registrar Nuevo Instrumento</h1>
        <a href="index.html" style="color: white; text-decoration: underline; font-size: 0.9rem;">&larr; Volver al Inventario</a>
    </header>

    <div class="form-container">
        <form id="registro-form">
            <!-- Sección A: Información -->
            <div class="form-group">
                <label>Nombre del Instrumento *</label>
                <input type="text" name="nombre" placeholder="Ej: Saxofón Alto" required>
            </div>
            
            <div class="form-group">
                <label>Marca</label>
                <input type="text" name="marca" placeholder="Ej: Yamaha">
            </div>

            <div class="form-group">
                <label>Número de Serie</label>
                <input type="text" name="serie" placeholder="S/N">
            </div>

            <!-- Sección B: Estado -->
            <div class="form-group">
                <label>Estado Inicial *</label>
                <select name="estado" required>
                    <option value="NUEVO">Nuevo</option>
                    <option value="BUENO">Bueno (Usado)</option>
                    <option value="REGULAR">Regular</option>
                    <option value="MALO">Malo (Requiere reparación)</option>
                </select>
            </div>

            <div class="form-group">
                <label>Fecha de Adquisición *</label>
                <input type="date" name="fecha_adquisicion" required>
            </div>

            <div class="form-group">
                <label>Origen</label>
                <select name="origen">
                    <option value="COMPRA">Compra Colegio</option>
                    <option value="DONACION">Donación</option>
                    <option value="MINISTERIO">Ministerio (MINEDU)</option>
                </select>
            </div>

            <!-- Sección C: Foto -->
            <div class="form-group" style="background: #f1f5f9; padding: 1rem; border-radius: 6px;">
                <label>Fotografía (Opcional)</label>
                <input type="file" id="foto-input" accept="image/*">
                <p style="font-size: 0.8rem; color: #666; margin-top: 5px;">Se subirá automáticamente.</p>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">
                Guardar Instrumento
            </button>
        </form>
    </div>

    <!-- LÓGICA ESPECÍFICA DE REGISTRO -->
    <script>
        // CONFIGURACIÓN CLOUDINARY (ASEGÚRATE DE COPIAR TUS DATOS AQUÍ TAMBIÉN)
        const CLOUDINARY_URL = 'https://api.cloudinary.com/v1_1/TU_CLOUD_NAME/image/upload';
        const CLOUDINARY_PRESET = 'TU_UPLOAD_PRESET'; 

        document.getElementById('registro-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            const txt = btn.innerText;
            btn.disabled = true;
            btn.innerText = "Procesando...";

            const fileInput = document.getElementById('foto-input');
            let imageUrl = '';

            // 1. Subir Imagen
            if (fileInput.files.length > 0) {
                const formDataImg = new FormData();
                formDataImg.append('file', fileInput.files[0]);
                formDataImg.append('upload_preset', CLOUDINARY_PRESET);

                try {
                    btn.innerText = "Subiendo foto...";
                    const resImg = await fetch(CLOUDINARY_URL, { method: 'POST', body: formDataImg });
                    const dataImg = await resImg.json();
                    if(dataImg.secure_url) imageUrl = dataImg.secure_url;
                } catch (err) {
                    console.error("Error imagen", err);
                }
            }

            // 2. Guardar en BD
            const formData = new FormData(e.target);
            const data = Object.fromEntries(formData.entries());
            data.imagen_url = imageUrl;

            try {
                btn.innerText = "Guardando...";
                const response = await fetch('/api/add-instrument', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                
                if (response.ok) {
                    alert('¡Registrado con éxito!');
                    window.location.href = 'index.html';
                } else {
                    alert('Error en el servidor');
                    btn.disabled = false;
                    btn.innerText = txt;
                }
            } catch (error) {
                console.error(error);
                alert('Error de conexión');
                btn.disabled = false;
                btn.innerText = txt;
            }
        });
    </script>
</body>
</html>
