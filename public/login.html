<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso - Banda Zoila Hora</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body { 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%); 
            margin: 0;
        }
        .login-card { 
            background: white; 
            padding: 2.5rem; 
            border-radius: 12px; 
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1), 0 10px 10px -5px rgba(0,0,0,0.04); 
            width: 90%; 
            max-width: 400px; 
            text-align: center; 
        }
        .icon-lock { font-size: 3rem; margin-bottom: 1rem; display: block; }
        .login-card h1 { color: #1e293b; margin-bottom: 0.5rem; font-size: 1.5rem; }
        .login-card p { color: #64748b; margin-bottom: 2rem; }
    </style>
</head>
<body>
    <div class="login-card">
        <span class="icon-lock">🔐</span>
        <h1>Acceso Autorizado</h1>
        <p>Sistema de Inventario<br>Colegio "Zoila Hora de Robles"</p>
        
        <form id="login-form">
            <div class="form-group">
                <input type="password" id="password" placeholder="Ingrese Contraseña" required 
                       style="text-align: center; font-size: 1.1rem; padding: 10px; width: 100%; border: 1px solid #ccc; border-radius: 6px;">
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1.5rem; padding: 12px;">Ingresar al Sistema</button>
        </form>
        
        <p id="error-msg" style="color: #ef4444; display: none; margin-top: 1rem; font-weight: bold;">⚠️ Contraseña incorrecta</p>
    </div>

    <script>
        // --- CONFIGURACIÓN DE SEGURIDAD ---
        const ACCESS_CODE = "banda2025"; // <--- CAMBIA ESTA CONTRASEÑA SI DESEAS

        // Verificar si ya está logueado para no pedir clave de nuevo
        if (sessionStorage.getItem('usuario_autorizado')) {
            window.location.href = 'index.html';
        }

        document.getElementById('login-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const input = document.getElementById('password').value;
            
            if (input === ACCESS_CODE) {
                // Guardamos "llave" en el navegador
                sessionStorage.setItem('usuario_autorizado', 'true');
                window.location.href = 'index.html';
            } else {
                const errorMsg = document.getElementById('error-msg');
                errorMsg.style.display = 'block';
                // Efecto de vibración simple
                document.querySelector('.login-card').animate([
                    { transform: 'translateX(0)' },
                    { transform: 'translateX(-10px)' },
                    { transform: 'translateX(10px)' },
                    { transform: 'translateX(0)' }
                ], { duration: 300 });
            }
        });
    </script>
</body>
</html>
